name: SDK Build lunatic7 Ipk

# Fix for broken build: https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write
  actions: write

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      packages:
        description: 'OpenWrt 包名，逗号分隔；留空时仅使用 compile_dirs'
        required: false
        default: 'luci-app-argon-config,luci-app-openvpn-server-client'

      config_pkg:
        description: 'OpenWrt 包配置，逗号分隔（示例: aria2,openvpn）'
        required: false
        default: 'aria2,iptables'

      compile_dirs:
        description: 'SDK 内直接编译的包目录，逗号分隔（示例: package/feeds/luci/luci-app-argon-config）'
        required: false
        default: ''

      package_files:
        description: '发布压缩包中的文件或 glob，逗号分隔（示例: luci-app-argon*.ipk,bin/targets/**/*.bin）'
        required: false
        default: ''
env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: Ubuntu-22.04
    name: Build Lunatic7 IPK [${{ matrix.platform }}]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: aarch64_generic
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/rockchip/armv8/openwrt-sdk-24.10.8-rockchip-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_ver: "24.10"

          - platform: qualcommax
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/qualcommax/ipq807x/openwrt-sdk-24.10.8-qualcommax-ipq807x_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_ver: "24.10"

          - platform: filogic
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/mediatek/filogic/openwrt-sdk-24.10.8-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_ver: "24.10"

          - platform: mt7621
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/ramips/mt7621/openwrt-sdk-24.10.8-ramips-mt7621_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_ver: "24.10"

          - platform: ath79
            sdk_url: https://downloads.openwrt.org/releases/24.10.8/targets/ath79/generic/openwrt-sdk-24.10.8-ath79-generic_gcc-13.3.0_musl.Linux-x86_64.tar.zst
            sdk_ver: "24.10"

    steps:
    - name: 检查
      uses: actions/checkout@main

    - name: 检查服务器配置
      run: |
        echo -e "------------------------------- CPU信息 -------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo -e "------------------------------- 内存信息 -------------------------------\n"
        echo "已安装内存详细信息: "
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo -e "------------------------------- 磁盘信息 -------------------------------\n"
        echo -e "磁盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "------------------------------- 磁盘详情 -------------------------------\n"
        df -Th

    - name: 释放Ubuntu磁盘空间
      uses: endersonmenezes/free-disk-space@v2
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
        testing: false

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E apt-get -qq install libgnutls28-dev coccinelle libfuse-dev \
        b43-fwcutter cups-ppdc
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
        echo "WRT_DATE_TAG=$(TZ=UTC-8 date +"%y.%m.%d-%H")" >> $GITHUB_ENV
        chmod +x opt.sh

    - name: ${{ matrix.platform }} sdk download
      run: |
          wget -q ${{ matrix.sdk_url }}
          file_name=$(echo ${{matrix.sdk_url}} | awk -F/ '{print $NF}')
          mkdir sdk
          mv -f package-configs/ sdk/package-configs
          if [[ $file_name == *.tar.xz ]]; then
            tar -xJf $file_name -C ./sdk --strip-components=1
          elif [[ $file_name == *.tar.zst ]]; then
            tar --zstd -x -f $file_name -C ./sdk --strip-components=1
          else
            echo "Unsupported file format: $file_name"
            exit 1
          fi
          cd sdk
          ls
          git clone https://github.com/lunatickochiya/AP-action package/kochiya
          cd package/kochiya
          rm -rf openwrt-*
          find . -mindepth 1 ! -path "./package" ! -path "./package/*" -exec rm -rf {} +
          cd ../..


    - name: ${{ matrix.platform }} feeds configuration packages
      run: |
          cd sdk
          cat > feeds.conf.default << EOF
          src-git base https://github.com/openwrt/openwrt.git;openwrt-${{ matrix.sdk_ver }}
          src-git packages https://github.com/openwrt/packages.git;openwrt-${{ matrix.sdk_ver }}
          src-git luci https://github.com/openwrt/luci.git;openwrt-${{ matrix.sdk_ver }}
          src-git routing https://github.com/openwrt/routing.git;openwrt-${{ matrix.sdk_ver }}
          src-git telephony https://github.com/openwrt/telephony.git;openwrt-${{ matrix.sdk_ver }}
          src-git lunatic7 https://github.com/lunatickochiya/luna-action-packages.git
          EOF


          ./scripts/feeds update -a
          rm -rf feeds/luci/applications/{luci-app-passwall,luci-app-smartdns}
          rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-libev,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,trojan-plus,tuic-client,v2ray-plugin,xray-plugin,geoview,shadow-tls,smartdns}
          ./scripts/feeds update -i
          ./scripts/feeds install -a
    - name: ${{ matrix.platform }} patch and mod config
      env:
        PACKAGES: ${{ github.event.inputs.packages }}
        CONFIG_PKG: ${{ github.event.inputs.config_pkg }}
      run: |
          cd sdk
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }
          #--------------------------------------begin_patches------------------------------------------
          echo "Start applying the patch"


          echo "update golang version"
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/sbwml/packages_lang_golang -b 26.x feeds/packages/lang/golang

          echo "fixed rust host build error"
          # (cd feeds/packages && curl -sL https://github.com/openwrt/packages/commit/0bcc41f3617e9041513a779a8a54f7fecae1efcd.patch | patch -p1 && echo "Rust 1.94.0 Patch applied")
          #sed -i 's/--set=llvm\.download-ci-llvm=false/--set=llvm.download-ci-llvm=true/' feeds/packages/lang/rust/Makefile
          grep -q -- '--ci false \\' feeds/packages/lang/rust/Makefile || sed -i '/x\.py \\/a \        --ci false \\' feeds/packages/lang/rust/Makefile


          echo "Patch application completed"
          #--------------------------------------end_patches--------------------------------------------

          echo "CONFIG_ALL_NONSHARED=n" > .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_ALL=n" >> .config
          echo "CONFIG_AUTOREMOVE=n" >> .config
          echo "CONFIG_SIGNED_PACKAGES=n" >> .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          IFS=',' read -r -a package_cfg <<< "$CONFIG_PKG"
          for cfg in "${package_cfg[@]}"; do
            cfg="$(trim "$cfg")"
            [ -z "$cfg" ] && continue
            bash "$GITHUB_WORKSPACE/opt.sh" "$cfg"
          done
          IFS=',' read -r -a package_array <<< "$PACKAGES"
          for pkg in "${package_array[@]}"; do
            pkg="$(trim "$pkg")"
            [ -z "$pkg" ] && continue
            echo "CONFIG_PACKAGE_$pkg=m" >> .config
          done
          for pkg in "${package_array[@]}"; do
            pkg="$(trim "$pkg")"
            [ -z "$pkg" ] && continue
            awk -v pkg="$pkg" '$0 ~ pkg { print }' .config
          done
          cat .config
          make defconfig

    - name: ${{ matrix.platform }} download
      run: |
          cd sdk
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;

    - name: ${{ matrix.platform }} compile
      id: compile
      env:
        PACKAGES: ${{ github.event.inputs.packages }}
        COMPILE_DIRS: ${{ github.event.inputs.compile_dirs }}
      run: |
          cd sdk
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          declare -A compiled_targets

          compile_directory() {
            local directory target
            directory="$(trim "$1")"
            directory="${directory#./}"
            directory="${directory%/}"

            case "$directory" in
              /*|..|../*|*/../*|*/..)
                echo "::error::Invalid compile directory: $directory"
                return 1
                ;;
              feeds/*)
                target="package/$directory"
                ;;
              package/*)
                target="$directory"
                ;;
              *)
                echo "::error::compile_dirs entries must start with feeds/ or package/: $directory"
                return 1
                ;;
            esac

            if [[ ! -d "$directory" ]]; then
              echo "::error::Compile directory does not exist: $directory"
              return 1
            fi

            if [[ -n "${compiled_targets[$target]:-}" ]]; then
              echo "-----------skip duplicate compile target $target ---------------"
              return 0
            fi

            echo "-----------begin compile $target ---------------"
            make "$target/compile" -j"$(nproc)" || make "$target/compile" -j1 V=s
            compiled_targets["$target"]=1
            echo "-----------compiled $target ---------------"
            echo ""
          }

          IFS=',' read -r -a package_array <<< "$PACKAGES"
          for package in "${package_array[@]}"; do
            package="$(trim "$package")"
            [ -z "$package" ] && continue

            mapfile -t package_dirs < <(find -L package -type f -path "*/$package/Makefile" -printf '%h\n')
            if [ "${#package_dirs[@]}" -eq 0 ]; then
              echo "::error::Unable to find package '$package'. Use compile_dirs to provide its SDK directory."
              exit 1
            fi

            for directory in "${package_dirs[@]}"; do
              compile_directory "$directory"
            done
          done

          IFS=',' read -r -a compile_dir_array <<< "$COMPILE_DIRS"
          for directory in "${compile_dir_array[@]}"; do
            directory="$(trim "$directory")"
            [ -z "$directory" ] && continue
            compile_directory "$directory"
          done

          if [ "${#compiled_targets[@]}" -eq 0 ]; then
            echo "::error::Set packages or compile_dirs to select at least one compile target."
            exit 1
          fi

          echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize ${{ matrix.platform }} files
      id: organize
      if: steps.compile.outputs.status == 'success'
      env:
        PACKAGES: ${{ github.event.inputs.packages }}
        CONFIG_PKG: ${{ github.event.inputs.config_pkg }}
        COMPILE_DIRS: ${{ github.event.inputs.compile_dirs }}
        PACKAGE_FILES: ${{ github.event.inputs.package_files }}
      run: |
          cd sdk
          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          mkdir -p upload
          shopt -s globstar
          declare -A files_to_package
          package_files_input="$(trim "$PACKAGE_FILES")"

          if [[ -n "$package_files_input" ]]; then
            IFS=',' read -r -a file_patterns <<< "$package_files_input"
            for pattern in "${file_patterns[@]}"; do
              pattern="$(trim "$pattern")"
              pattern="${pattern#./}"
              [ -z "$pattern" ] && continue

              case "$pattern" in
                /*|..|../*|*/../*|*/..)
                  echo "::error::Invalid package_files entry: $pattern"
                  exit 1
                  ;;
              esac

              if [[ "$pattern" != */* ]]; then
                pattern="bin/packages/**/$pattern"
              fi

              mapfile -t matches < <(compgen -G "$pattern" || true)
              matched_file=false
              for file in "${matches[@]}"; do
                if [[ -f "$file" ]]; then
                  files_to_package["$file"]=1
                  matched_file=true
                fi
              done

              if [[ "$matched_file" != true ]]; then
                echo "::error::No files matched package_files entry: $pattern"
                exit 1
              fi
            done
          else
            while IFS= read -r -d '' file; do
              files_to_package["$file"]=1
            done < <(find bin/packages -type f -print0)
          fi

          if [ "${#files_to_package[@]}" -eq 0 ]; then
            echo "::error::No files are available to package."
            exit 1
          fi

          zip -j upload/"$WRT_DATE"_packages_ipk_${{ matrix.platform }}.zip "${!files_to_package[@]}"
          printf '%s\n' "- 编译的软件包名称: \`$PACKAGES\`" >> release.txt
          printf '%s\n' "- 编译的软件包配置: \`$CONFIG_PKG\`" >> release.txt
          printf '%s\n' "- 指定编译目录: \`$COMPILE_DIRS\`" >> release.txt
          if [[ -n "$package_files_input" ]]; then
            printf '%s\n' "- 打包文件: \`$PACKAGE_FILES\`" >> release.txt
          else
            printf '%s\n' "- 打包文件: \`bin/packages/**\`" >> release.txt
          fi
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          cd ../
          echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.organize.outputs.status == 'success'
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          tag_name: ${{ env.WRT_DATE_TAG }}
          body_path: ${{ env.FIRMWARE }}/release.txt
          files: ${{ env.FIRMWARE }}/upload/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 90
        keep_minimum_runs: 10
